name: LHCI — presupuestos KB (C-01)

on:
  pull_request:
  workflow_dispatch:

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        # Placeholders que pasan el schema de src/lib/env.ts (validado en
        # import y / se prerenderiza en build). No son secretos reales:
        # LHCI solo mide la landing pública.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          RESEND_API_KEY: placeholder-resend-key
          CONTACTO_DESTINO: contacto@quantihidroponia.com.ar
          RESEND_REMITENTE: no-reply@quantihidroponia.com.ar
      - run: npx @lhci/cli autorun
